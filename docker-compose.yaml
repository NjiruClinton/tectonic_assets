services:
  postgres:
    image: postgres:15
    container_name: tectonic_postgres
    environment:
      POSTGRES_DB: tectonic_assets
      POSTGRES_USER: clinton
      POSTGRES_PASSWORD: Clint1235
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tectonic_assets_app
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDRESS: ":8080"
      DB_CONNECTION_STRING: "postgres://clinton:Clint1235@postgres:5432/tectonic_assets?sslmode=disable"
      PROFILE_INTERVAL: "5s"
    depends_on:
      - postgres
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
